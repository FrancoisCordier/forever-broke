# Collector configuration. See docs/architecture.md.
region: eu

# The owner's house (Alliance, confirmed 2026-11-25). The buy list is computed for this house only.
focusHouse: 110

# First raids open (Barrow Deeps, Hyjal Summit, Onyxia's Lair). Exact unlock hour unknown: start of day UTC.
raidOpens: "2026-12-09T00:00:00Z"

# Items an NPC vendor sells, in copper per unit (from item purchase_price / purchase_quantity, A19).
# The AH price can't stay above these, so they're never worth stockpiling.
vendorPrices:
  18256: 6000 # Imbued Vial, 60s
  8925: 500 # Crystal Vial, 5s

# Kit items that bind when picked up, so they never reach the AH: farm or quest them (item API `binding`,
# checked 2026-11-27). They stay on the watchlist for their name and icon; the site leaves them out of costs.
soulbound:
  - 8410 # R.O.I.D.S.
  - 8411 # Lung Juice Cocktail
  - 8412 # Ground Scorpok Assay
  - 8423 # Cerebral Cortex Compound
  - 12451 # Juju Power
  - 12460 # Juju Might
  - 12662 # Demonic Rune
  - 18269 # Gordok Green Grog
  - 227286 # Warmed Rumsey Rum with Cream

# All non-empty houses (ADR-0004). 112/115/118 are always empty (A7b) and are skipped.
# "set" groups are a hypothesis (A8), except that 110 is confirmed as the owner's house.
houses:
  - { id: 110, label: "Alliance (mine)", faction: alliance, set: A }
  - { id: 113, label: "Horde (set A?)", faction: horde, set: A }
  - { id: 116, label: "Blackwater (set A?)", faction: blackwater, set: A }
  - { id: 111, label: "Alliance (set B)", faction: alliance, set: B }
  - { id: 114, label: "Horde (set B?)", faction: horde, set: B }
  - { id: 117, label: "Blackwater (set B?)", faction: blackwater, set: B }
  - { id: 119, label: "Alliance (set D)", faction: alliance, set: D }
  - { id: 120, label: "Horde (set D)", faction: horde, set: D }
  - { id: 121, label: "Blackwater (set D)", faction: blackwater, set: D }
  - { id: 123, label: "Alliance (set E)", faction: alliance, set: E }
  - { id: 124, label: "Horde (set E)", faction: horde, set: E }
  - { id: 125, label: "Blackwater (set E)", faction: blackwater, set: E }

