# Raid kits for the "My kit" page. Quantities are per raid night (~3 h); the page lets you change them.
# Every item must be on the watchlist (that's where its price comes from). A slot with several
# options means "pick one"; the first is the default.
kits:
  # From the owner's MM hunter sim (2026-11-27). `dps` = DPS lost without that one item, everything else on;
  # slots are in that order. Left out: Major Frenzy Potion (+4 DPS, but it takes the potion cooldown from Major
  # Mana Potion, which is worth more), sharpening stones (melee only), Ferocity/Sages/Fortitude (not in the sim).
  hunter_mm:
    label: Hunter · Marksmanship
    slots:
      - slot: Rune
        dps: 50
        perNight: 6 # own cooldown, on top of potions: about one per boss plus long trash
        options: [12662, 20520]
        note: Demonic Rune. Own cooldown, so it comes on top of your mana potions. Dark Rune shares that cooldown.
      - slot: Agility elixir
        dps: 43
        perNight: 6 # 30 min
        options: [13452]
        note: Elixir of the Mongoose. The best single consumable.
      - slot: Mana potion
        dps: 33
        perNight: 6 # 2 min cooldown: about one per boss plus long trash
        options: [13444]
        note: Use every potion cooldown on this, not Major Frenzy.
      - slot: Scorpok
        dps: 22
        perNight: 3 # 1 h
        options: [8412]
        note: Ground Scorpok Assay. Stacks with Mongoose. Never listed on the AH so far.
      - slot: Flask
        dps: 21
        perNight: 2 # 2 h each, persists through death
        options: [274274]
        note: Natural Aggression. The +2% crit only counts in Hyjal and the Barrow Deeps.
      - slot: Food
        dps: 18
        perNight: 12 # well fed lasts 15 min
        options: [250072]
        note: Swiftstrike Steak (+20 Agi). Grilled Squid is +1% crit on Forever, not Agility.
      - slot: Intellect
        dps: 15
        perNight: 3 # 1 h
        options: [9179]
        note: Careful Aim turns the Intellect into attack power, and it's mana.
      - slot: Juju Might
        dps: 12
        perNight: 6 # 10 min: one per boss
        options: [12460, 12820]
        note: Same slot as Winterfall Firewater. Juju Might has never been listed on the AH so far.
      - slot: Mana regen
        dps: 8
        perNight: 6 # 30 min
        options: [250341]
        note: Greater Mageblood. Stacking with Mongoose isn't confirmed in game.
      - slot: Weapon oil
        dps: 7
        perNight: 6 # 30 min
        options: [20747]
        note: Lesser Mana Oil. Turret only (you never swing). Brilliant Mana Oil can't be had yet.

# Buy-list thresholds (ADR-0007). Sell-side thresholds (spike, squeeze) come with the stockpile phase.
thresholds:
  belowMedianPct: 20 # "cheap" = current p10 at least 20% under the 7-day median
  minUnitsListed: 20 # ignore items with fewer units listed
  minNormalDays: 1 # don't call anything cheap on less than a day of history
  belowCraftPct: 10 # "under craft cost" = market price at least 10% under its reagents' cost (ADR-0010)
  # Stockpile sell flag (ADR-0011): both must hold.
  sellAboveCostPct: 30 # after the 5% AH cut, at least 30% above what you paid
  sellAboveNormalPct: 15 # and the market at least 15% above its normal price (a spike, not a new normal)
  # "Resell" on the Buy list (ADR-0012), from estimated sales over the last 3 days:
  flipMarginPct: 15 # relisting at the average price paid, after the 5% cut, beats the buy price by 15%+
  flipHoldDays: 2 # suggest at most ~2 days of sales, so the units actually sell
  flipMinSalesHours: 12 # hours of sales data needed before flagging anything
  flipMinProfitGold: 5 # not worth the trip below this total profit
