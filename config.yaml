# Raid kits for the "My kit" page (ADR-0014): one per class and spec, picked by class then spec on the site.
# Quantities are per raid night (~3 h), from each item's duration (item API text, 2026-11-27): 2 h flask 2,
# 1 h buff 3, 30 min buff 6, 15 min food 12, and 6 for potions, runes and short buffs (about one per boss).
# The page lets the viewer change them. Every item must be on the watchlist (that's where its price comes
# from). A slot with several options means "pick one": the default is the first that isn't soulbound, or
# the cheapest listed one when the slot says `cheapest: true`. `dps` (DPS lost without it, everything else
# on) only where a sim backs it; other kits keep their guide's order.
kits:
  # Hunter: the owner's guide, https://toxickevinferm.github.io/hunter-guide/guide/ (WoWSims Forever, simmed
  # 2026-11-19). `dps` per playstyle from its consumables table; alternatives as further options.
  # Marksmanship is the owner's own list (2026-11-27), which matches the guide's turret column.
  hunter_mm:
    class: Hunter
    spec: Marksmanship
    source:
      {
        name: Forever Hunter Guide (turret),
        url: "https://toxickevinferm.github.io/hunter-guide/guide/?build=mm-turret",
        date: "2026-11-19",
      }
    slots:
      - slot: Rune
        dps: 50
        perNight: 6 # own cooldown, on top of potions: about one per boss plus long trash
        options: [20520, 12662]
        note: Own cooldown, so it comes on top of your mana potions. Demonic Rune is the same but soulbound, so the AH only has Dark Rune.
      - slot: Agility elixir
        dps: 43
        perNight: 6 # 30 min
        options: [13452]
        note: Elixir of the Mongoose. The best single consumable.
      - slot: Mana potion
        dps: 33
        perNight: 6 # 2 min cooldown: about one per boss plus long trash
        options: [13444]
        note: Use every potion cooldown on this, not Major Frenzy.
      - slot: Scorpok
        dps: 22
        perNight: 3 # 1 h
        options: [8412]
        note: Ground Scorpok Assay. Stacks with Mongoose.
      - slot: Flask
        dps: 21
        perNight: 2 # 2 h each, persists through death
        options: [274274, 13511]
        note: Natural Aggression. The +2% crit only counts in Hyjal and the Barrow Deeps. Anywhere else, take Flask of Distilled Wisdom (+17).
      - slot: Food
        dps: 18
        perNight: 12 # well fed lasts 15 min
        options: [250072]
        note: Swiftstrike Steak (+20 Agi). Grilled Squid is +1% crit on Forever, not Agility.
      - slot: Intellect
        dps: 15
        perNight: 3 # 1 h
        options: [9179]
        note: Careful Aim turns the Intellect into attack power, and it's mana.
      - slot: Juju Might
        dps: 12
        perNight: 6 # 10 min: one per boss
        options: [12460]
        note: Ranged and melee attack power. Winterfall Firewater takes the same slot but is melee only, so it does nothing at range.
      - slot: Mana regen
        dps: 8
        perNight: 6 # 30 min
        options: [250341]
        note: Greater Mageblood. Stacking with Mongoose isn't confirmed in game.
      - slot: Weapon oil
        dps: 7
        perNight: 6 # 30 min
        options: [20747]
        note: Lesser Mana Oil. Turret only (you never swing). Brilliant Mana Oil can't be had yet.

