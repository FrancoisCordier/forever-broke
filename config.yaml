# Raid kits for the "My kit" page. Quantities are per raid night (~3 h); the page lets you change them.
# Every item must be on the watchlist (that's where its price comes from). A slot with several
# options means "pick one"; the first is the default.
kits:
  hunter_mm:
    label: Hunter · Marksmanship
    slots:
      - slot: Flask
        perNight: 2 # 2 h each, persists through death
        options: [274273, 274274]
        note: Natural Accuracy while you're under the hit cap, otherwise Natural Aggression. Raid zones only.
      - slot: Agility elixir
        perNight: 6
        options: [13452, 250328, 250350]
        note: Mongoose (+25 Agi, +2% crit) beats Cunning and Ferocity. Whether they stack is untested.
      - slot: Mana regen
        perNight: 6
        options: [250341]
      - slot: Mana potion
        perNight: 3
        options: [13444]
      - slot: Healing potion
        perNight: 2
        options: [13446]
      - slot: Food
        perNight: 6 # well fed lasts 15 min: eat before each boss
        options: [13928]
      - slot: Attack power potion
        perNight: 0
        options: [250943]
        note: “+80 Attack Power”. Check in game that it raises ranged AP before buying.

# Buy-list thresholds (ADR-0007). Sell-side thresholds (spike, squeeze) come with the stockpile phase.
thresholds:
  belowMedianPct: 20 # "cheap" = current p10 at least 20% under the 7-day median
  minUnitsListed: 20 # ignore items with fewer units listed
  minNormalDays: 1 # don't call anything cheap on less than a day of history
  belowCraftPct: 10 # "under craft cost" = market price at least 10% under its reagents' cost (ADR-0010)
